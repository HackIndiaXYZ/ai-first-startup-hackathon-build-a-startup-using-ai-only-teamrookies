<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="emeraldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Shield Base -->
  <rect width="64" height="64" rx="16" fill="#070A10" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#1E293F" stroke-width="1.5" />

  <!-- Background Subtle Grid / Radar Target -->
  <circle cx="32" cy="32" r="22" stroke="#172033" stroke-width="1" stroke-dasharray="3 3" />
  <circle cx="32" cy="32" r="14" stroke="#172033" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Decision Nexus: Stylized Geometric "AI" Diamond Prism -->
  <!-- Outer Prism Facet Left -->
  <path d="M32 10 L16 32 L32 54 L32 32 Z" fill="url(#neonGlow)" fill-opacity="0.25" stroke="url(#emeraldCyan)" stroke-width="2" stroke-linejoin="round" />
  <!-- Outer Prism Facet Right -->
  <path d="M32 10 L48 32 L32 54 L32 32 Z" fill="url(#emeraldCyan)" fill-opacity="0.45" stroke="url(#emeraldCyan)" stroke-width="2" stroke-linejoin="round" />

  <!-- Center Core Star / Intelligence Core -->
  <circle cx="32" cy="32" r="4.5" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="32" cy="32" r="2.5" fill="#06B6D4" />

  <!-- Quantum / Decision Nodes -->
  <circle cx="32" cy="10" r="2" fill="#10B981" />
  <circle cx="16" cy="32" r="2" fill="#06B6D4" />
  <circle cx="48" cy="32" r="2" fill="#3B82F6" />
  <circle cx="32" cy="54" r="2" fill="#10B981" />
</svg>